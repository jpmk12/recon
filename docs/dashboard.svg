<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="recon dashboard preview">
  <title>recon — network inventory dashboard</title>

  <!-- Page background -->
  <rect width="1600" height="920" fill="#0b0d10"/>

  <!-- ============================ SIDEBAR ============================ -->
  <rect x="0" y="0" width="220" height="920" fill="#13171c"/>
  <line x1="220" y1="0" x2="220" y2="920" stroke="#222831"/>

  <!-- Logo -->
  <circle cx="30" cy="40" r="4.5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="44" fill="#e6e8ec" font-size="15" font-weight="600" letter-spacing="0.5">recon</text>
  <text x="22" y="62" fill="#8a93a6" font-size="11">network inventory</text>
  <line x1="14" y1="80" x2="206" y2="80" stroke="#222831"/>

  <!-- Nav (Dashboard active) -->
  <rect x="14" y="94" width="192" height="34" rx="8" fill="#0b0d10" stroke="#222831"/>
  <text x="28" y="116" fill="#e6e8ec" font-size="13" font-weight="500">Dashboard</text>
  <text x="28" y="148" fill="#8a93a6" font-size="13">Devices</text>
  <text x="28" y="180" fill="#8a93a6" font-size="13">Issues</text>
  <rect x="170" y="166" width="26" height="18" rx="9" fill="#f87171"/>
  <text x="183" y="179" text-anchor="middle" fill="#0b0d10" font-size="10" font-weight="700">7</text>
  <text x="28" y="212" fill="#8a93a6" font-size="13">Scans</text>
  <text x="28" y="244" fill="#8a93a6" font-size="13">Settings</text>

  <!-- Footer -->
  <line x1="0" y1="860" x2="220" y2="860" stroke="#222831"/>
  <text x="22" y="884" fill="#34d399" font-size="11">● auth enabled</text>
  <text x="22" y="902" fill="#8a93a6" font-size="11">/ focuses search</text>

  <!-- ============================ HEADER ============================ -->
  <text x="252" y="62" fill="#e6e8ec" font-size="24" font-weight="600">Dashboard</text>
  <text x="252" y="86" fill="#8a93a6" font-size="13">Last scan 3m ago · 192.168.1.0/24, 10.0.0.0/24 · 31 hosts known, 28 up</text>

  <!-- Scan now button -->
  <rect x="1430" y="48" width="138" height="38" rx="8" fill="#60a5fa"/>
  <text x="1499" y="72" text-anchor="middle" fill="#0b0d10" font-size="13" font-weight="600">↻  Scan now</text>

  <!-- ============================ STAT CARDS ============================ -->
  <!-- Card 1: Hosts up -->
  <rect x="252" y="118" width="254" height="124" rx="12" fill="#13171c" stroke="#222831"/>
  <text x="270" y="142" fill="#8a93a6" font-size="10" letter-spacing="1">HOSTS UP</text>
  <text x="270" y="186" fill="#34d399" font-size="36" font-weight="600">28</text>
  <text x="270" y="216" fill="#8a93a6" font-size="11">of 31 known</text>

  <!-- Card 2: Open ports -->
  <rect x="522" y="118" width="254" height="124" rx="12" fill="#13171c" stroke="#222831"/>
  <text x="540" y="142" fill="#8a93a6" font-size="10" letter-spacing="1">OPEN PORTS</text>
  <text x="540" y="186" fill="#60a5fa" font-size="36" font-weight="600">142</text>
  <text x="540" y="216" fill="#8a93a6" font-size="11">across 28 hosts</text>

  <!-- Card 3: Services -->
  <rect x="792" y="118" width="254" height="124" rx="12" fill="#13171c" stroke="#222831"/>
  <text x="810" y="142" fill="#8a93a6" font-size="10" letter-spacing="1">SERVICES</text>
  <text x="810" y="186" fill="#fbbf24" font-size="36" font-weight="600">23</text>
  <text x="810" y="216" fill="#8a93a6" font-size="11">distinct</text>

  <!-- Card 4: Open issues  -->
  <rect x="1062" y="118" width="254" height="124" rx="12" fill="#13171c" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="1080" y="142" fill="#8a93a6" font-size="10" letter-spacing="1">OPEN ISSUES</text>
  <text x="1080" y="186" fill="#f87171" font-size="36" font-weight="600">7</text>
  <!-- Severity chips -->
  <rect x="1080" y="202" width="58" height="18" rx="9" fill="#f87171" fill-opacity="0.2" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="1109" y="215" text-anchor="middle" fill="#f87171" font-size="9" font-weight="600" letter-spacing="0.5">CRIT · 1</text>
  <rect x="1142" y="202" width="56" height="18" rx="9" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="1170" y="215" text-anchor="middle" fill="#f87171" font-size="9" font-weight="600" letter-spacing="0.5">HIGH · 3</text>
  <rect x="1202" y="202" width="50" height="18" rx="9" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.4"/>
  <text x="1227" y="215" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600" letter-spacing="0.5">MED · 2</text>
  <rect x="1256" y="202" width="46" height="18" rx="9" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.4"/>
  <text x="1279" y="215" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="600" letter-spacing="0.5">LOW · 1</text>

  <!-- Card 5: Last scan -->
  <rect x="1332" y="118" width="236" height="124" rx="12" fill="#13171c" stroke="#222831"/>
  <text x="1350" y="142" fill="#8a93a6" font-size="10" letter-spacing="1">LAST SCAN</text>
  <text x="1350" y="186" fill="#34d399" font-size="32" font-weight="600">ok</text>
  <text x="1350" y="216" fill="#8a93a6" font-size="11">3m ago · 2.4s · 142 ports</text>

  <!-- ============================ ROW 2: SERVICES + CATEGORIES ============================ -->
  <!-- Top services card -->
  <rect x="252" y="262" width="884" height="252" rx="12" fill="#13171c" stroke="#222831"/>
  <text x="272" y="290" fill="#8a93a6" font-size="11" letter-spacing="1">TOP SERVICES</text>

  <!-- chart area: x 290..1110, y 310..480, baseline 470 -->
  <g>
    <line x1="290" y1="470" x2="1110" y2="470" stroke="#222831"/>
    <!-- gridlines -->
    <line x1="290" y1="430" x2="1110" y2="430" stroke="#1a1f26" stroke-dasharray="3,3"/>
    <line x1="290" y1="390" x2="1110" y2="390" stroke="#1a1f26" stroke-dasharray="3,3"/>
    <line x1="290" y1="350" x2="1110" y2="350" stroke="#1a1f26" stroke-dasharray="3,3"/>
    <line x1="290" y1="310" x2="1110" y2="310" stroke="#1a1f26" stroke-dasharray="3,3"/>

    <!-- bars: max 14 → 140px tall. 1 unit = 10px. baseline 470. -->
    <!-- http 14 -->
    <rect x="306" y="330" width="86" height="140" rx="4" fill="#60a5fa"/>
    <text x="349" y="488" text-anchor="middle" fill="#8a93a6" font-size="11">http</text>
    <text x="349" y="322" text-anchor="middle" fill="#e6e8ec" font-size="11" font-weight="600">14</text>
    <!-- ssh 8 -->
    <rect x="408" y="390" width="86" height="80" rx="4" fill="#60a5fa"/>
    <text x="451" y="488" text-anchor="middle" fill="#8a93a6" font-size="11">ssh</text>
    <text x="451" y="382" text-anchor="middle" fill="#e6e8ec" font-size="11" font-weight="600">8</text>
    <!-- https 7 -->
    <rect x="510" y="400" width="86" height="70" rx="4" fill="#60a5fa"/>
    <text x="553" y="488" text-anchor="middle" fill="#8a93a6" font-size="11">https</text>
    <text x="553" y="392" text-anchor="middle" fill="#e6e8ec" font-size="11" font-weight="600">7</text>
    <!-- domain 4 -->
    <rect x="612" y="430" width="86" height="40" rx="4" fill="#60a5fa"/>
    <text x="655" y="488" text-anchor="middle" fill="#8a93a6" font-size="11">domain</text>
    <text x="655" y="422" text-anchor="middle" fill="#e6e8ec" font-size="11" font-weight="600">4</text>
    <!-- microsoft-ds 2 -->
    <rect x="714" y="450" width="86" height="20" rx="4" fill="#60a5fa"/>
    <text x="757" y="488" text-anchor="middle" fill="#8a93a6" font-size="10">microsoft-ds</text>
    <text x="757" y="442" text-anchor="middle" fill="#e6e8ec" font-size="11" font-weight="600">2</text>
    <!-- ipp 2 -->
    <rect x="816" y="450" width="86" height="20" rx="4" fill="#60a5fa"/>
    <text x="859" y="488" text-anchor="middle" fill="#8a93a6" font-size="11">ipp</text>
    <text x="859" y="442" text-anchor="middle" fill="#e6e8ec" font-size="11" font-weight="600">2</text>
    <!-- jetdirect 1 -->
    <rect x="918" y="460" width="86" height="10" rx="4" fill="#60a5fa"/>
    <text x="961" y="488" text-anchor="middle" fill="#8a93a6" font-size="11">jetdirect</text>
    <text x="961" y="452" text-anchor="middle" fill="#e6e8ec" font-size="11" font-weight="600">1</text>
    <!-- rtsp 1 -->
    <rect x="1020" y="460" width="86" height="10" rx="4" fill="#60a5fa"/>
    <text x="1063" y="488" text-anchor="middle" fill="#8a93a6" font-size="11">rtsp</text>
    <text x="1063" y="452" text-anchor="middle" fill="#e6e8ec" font-size="11" font-weight="600">1</text>
  </g>

  <!-- Categories card -->
  <rect x="1152" y="262" width="416" height="252" rx="12" fill="#13171c" stroke="#222831"/>
  <text x="1172" y="290" fill="#8a93a6" font-size="11" letter-spacing="1">CATEGORIES</text>

  <g font-size="13">
    <text x="1172" y="316" fill="#e6e8ec">Computer</text>
    <text x="1548" y="316" fill="#8a93a6" text-anchor="end">8</text>
    <line x1="1172" y1="324" x2="1548" y2="324" stroke="#222831"/>
    <text x="1172" y="346" fill="#e6e8ec">IoT</text>
    <text x="1548" y="346" fill="#8a93a6" text-anchor="end">5</text>
    <line x1="1172" y1="354" x2="1548" y2="354" stroke="#222831"/>
    <text x="1172" y="376" fill="#e6e8ec">Phone</text>
    <text x="1548" y="376" fill="#8a93a6" text-anchor="end">4</text>
    <line x1="1172" y1="384" x2="1548" y2="384" stroke="#222831"/>
    <text x="1172" y="406" fill="#e6e8ec">Smart speaker</text>
    <text x="1548" y="406" fill="#8a93a6" text-anchor="end">3</text>
    <line x1="1172" y1="414" x2="1548" y2="414" stroke="#222831"/>
    <text x="1172" y="436" fill="#e6e8ec">Server</text>
    <text x="1548" y="436" fill="#8a93a6" text-anchor="end">2</text>
    <line x1="1172" y1="444" x2="1548" y2="444" stroke="#222831"/>
    <text x="1172" y="466" fill="#e6e8ec">TV / streaming</text>
    <text x="1548" y="466" fill="#8a93a6" text-anchor="end">2</text>
    <line x1="1172" y1="474" x2="1548" y2="474" stroke="#222831"/>
    <text x="1172" y="496" fill="#e6e8ec">Router · NAS · Printer · Camera</text>
    <text x="1548" y="496" fill="#8a93a6" text-anchor="end">4</text>
  </g>

  <!-- ============================ ROW 3: ISSUES + RECENT CHANGES ============================ -->
  <!-- Top issues card -->
  <rect x="252" y="534" width="884" height="348" rx="12" fill="#13171c" stroke="#222831"/>
  <text x="272" y="562" fill="#8a93a6" font-size="11" letter-spacing="1">TOP ISSUES</text>
  <text x="1116" y="562" fill="#60a5fa" font-size="11" text-anchor="end">View all →</text>

  <!-- Issue row 1: CRITICAL CVE -->
  <g transform="translate(272, 580)">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#f87171" fill-opacity="0.2" stroke="#f87171" stroke-opacity="0.5"/>
    <text x="30" y="14" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700" letter-spacing="0.5">CRITICAL</text>
    <text x="74" y="14" fill="#e6e8ec" font-size="13" font-weight="500">CVE-2021-44228 (CVSS 10.0)</text>
    <text x="74" y="32" fill="#8a93a6" font-size="11">http log4j on 8080/tcp — homelab.lan · 192.168.1.42</text>
    <text x="824" y="14" fill="#60a5fa" font-size="11" text-anchor="end">192.168.1.42</text>
  </g>

  <line x1="272" y1="624" x2="1116" y2="624" stroke="#222831"/>

  <!-- Issue row 2: HIGH SMBv1 -->
  <g transform="translate(272, 638)">
    <rect x="0" y="0" width="44" height="20" rx="4" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.4"/>
    <text x="22" y="14" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700" letter-spacing="0.5">HIGH</text>
    <text x="58" y="14" fill="#e6e8ec" font-size="13" font-weight="500">SMBv1 enabled</text>
    <text x="58" y="32" fill="#8a93a6" font-size="11">445/tcp microsoft-ds — vulnerable to EternalBlue. Disable in SMB config.</text>
    <text x="824" y="14" fill="#60a5fa" font-size="11" text-anchor="end">nas.lan</text>
  </g>

  <line x1="272" y1="682" x2="1116" y2="682" stroke="#222831"/>

  <!-- Issue row 3: HIGH telnet -->
  <g transform="translate(272, 696)">
    <rect x="0" y="0" width="44" height="20" rx="4" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.4"/>
    <text x="22" y="14" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700" letter-spacing="0.5">HIGH</text>
    <text x="58" y="14" fill="#e6e8ec" font-size="13" font-weight="500">Telnet exposed</text>
    <text x="58" y="32" fill="#8a93a6" font-size="11">23/tcp — credentials sent in cleartext. Disable or replace with SSH.</text>
    <text x="824" y="14" fill="#60a5fa" font-size="11" text-anchor="end">homelab.lan</text>
  </g>

  <line x1="272" y1="740" x2="1116" y2="740" stroke="#222831"/>

  <!-- Issue row 4: HIGH TLS expired -->
  <g transform="translate(272, 754)">
    <rect x="0" y="0" width="44" height="20" rx="4" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.4"/>
    <text x="22" y="14" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700" letter-spacing="0.5">HIGH</text>
    <text x="58" y="14" fill="#e6e8ec" font-size="13" font-weight="500">TLS certificate expired</text>
    <text x="58" y="32" fill="#8a93a6" font-size="11">5001/tcp https — expired 17 day(s) ago. Renew now.</text>
    <text x="824" y="14" fill="#60a5fa" font-size="11" text-anchor="end">nas.lan</text>
  </g>

  <line x1="272" y1="798" x2="1116" y2="798" stroke="#222831"/>

  <!-- Issue row 5: MEDIUM Unknown device -->
  <g transform="translate(272, 812)">
    <rect x="0" y="0" width="62" height="20" rx="4" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.4"/>
    <text x="31" y="14" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700" letter-spacing="0.5">MEDIUM</text>
    <text x="76" y="14" fill="#e6e8ec" font-size="13" font-weight="500">Unknown device detected</text>
    <text x="76" y="32" fill="#8a93a6" font-size="11">192.168.1.150 · TP-Link · first seen 3m ago</text>
    <text x="824" y="14" fill="#60a5fa" font-size="11" text-anchor="end">192.168.1.150</text>
  </g>

  <!-- Recent changes card -->
  <rect x="1152" y="534" width="416" height="348" rx="12" fill="#13171c" stroke="#222831"/>
  <text x="1172" y="562" fill="#8a93a6" font-size="11" letter-spacing="1">RECENT CHANGES</text>

  <!-- Event 1: new host -->
  <g transform="translate(1172, 580)">
    <text x="0" y="14" fill="#34d399" font-size="10" font-weight="600" letter-spacing="0.5">NEW HOST</text>
    <text x="0" y="30" fill="#e6e8ec" font-size="12">192.168.1.150 discovered</text>
    <text x="376" y="14" fill="#8a93a6" font-size="11" text-anchor="end">3m ago</text>
  </g>
  <line x1="1172" y1="618" x2="1548" y2="618" stroke="#222831"/>

  <!-- Event 2: port opened -->
  <g transform="translate(1172, 632)">
    <text x="0" y="14" fill="#60a5fa" font-size="10" font-weight="600" letter-spacing="0.5">PORT OPENED</text>
    <text x="0" y="30" fill="#e6e8ec" font-size="12">8443/tcp https · homelab.lan</text>
    <text x="376" y="14" fill="#8a93a6" font-size="11" text-anchor="end">3m ago</text>
  </g>
  <line x1="1172" y1="670" x2="1548" y2="670" stroke="#222831"/>

  <!-- Event 3: service changed -->
  <g transform="translate(1172, 684)">
    <text x="0" y="14" fill="#fbbf24" font-size="10" font-weight="600" letter-spacing="0.5">SERVICE CHANGED</text>
    <text x="0" y="30" fill="#e6e8ec" font-size="12">22/tcp ssh: OpenSSH 7.4 → 9.6</text>
    <text x="376" y="14" fill="#8a93a6" font-size="11" text-anchor="end">12m ago</text>
  </g>
  <line x1="1172" y1="722" x2="1548" y2="722" stroke="#222831"/>

  <!-- Event 4: host up -->
  <g transform="translate(1172, 736)">
    <text x="0" y="14" fill="#34d399" font-size="10" font-weight="600" letter-spacing="0.5">HOST UP</text>
    <text x="0" y="30" fill="#e6e8ec" font-size="12">smart-plug-garage came online</text>
    <text x="376" y="14" fill="#8a93a6" font-size="11" text-anchor="end">12m ago</text>
  </g>
  <line x1="1172" y1="774" x2="1548" y2="774" stroke="#222831"/>

  <!-- Event 5: port closed -->
  <g transform="translate(1172, 788)">
    <text x="0" y="14" fill="#8a93a6" font-size="10" font-weight="600" letter-spacing="0.5">PORT CLOSED</text>
    <text x="0" y="30" fill="#e6e8ec" font-size="12">9100/tcp jetdirect · printer</text>
    <text x="376" y="14" fill="#8a93a6" font-size="11" text-anchor="end">12m ago</text>
  </g>
  <line x1="1172" y1="826" x2="1548" y2="826" stroke="#222831"/>

  <!-- Event 6: host down -->
  <g transform="translate(1172, 840)">
    <text x="0" y="14" fill="#8a93a6" font-size="10" font-weight="600" letter-spacing="0.5">HOST DOWN</text>
    <text x="0" y="30" fill="#e6e8ec" font-size="12">laptop-work went offline</text>
    <text x="376" y="14" fill="#8a93a6" font-size="11" text-anchor="end">1h ago</text>
  </g>
</svg>
